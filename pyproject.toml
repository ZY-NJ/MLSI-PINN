[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsi-pinn"
version = "0.1.0"
description = "Ca II multilayer spectral inversion with a physics-informed neural network"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "astropy>=5.2,<8", "torch>=2.0,<3"]

[tool.setuptools.packages.find]
include = ["mlsi_pinn*"]
